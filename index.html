    <!-- Original Tailwind CDN and Exact Theme Config -->

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['DM Sans', 'sans-serif'],
              display: ['Instrument Serif', 'Georgia', 'serif'],
              serif: ['Instrument Serif', 'Georgia', 'serif'],

            colors: {
              night: '#05070A',
              paper: '#F8F9FA',
              'brand-teal': '#1494B4',
              'brand-dark-teal': '#0E6A82',
              'brand-red': '#D34E3F',
              'brand-orange': '#D75E30',
              'brand-beige': '#F5D6BA',
            },
            backgroundImage: {

                '0%, 100%': { transform: 'translateY(0)' },

              scroll: {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' },
              },

          },
